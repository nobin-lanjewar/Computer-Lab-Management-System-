{% extends "base.html" %}
{% block title %}{{ page_title }} | Lab Management{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">EQUIPMENT</p><h1>{{ page_title }}</h1></div></div>
<form method="post" class="record-form">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
    <a class="btn btn-outline-secondary" href="{% url 'labs:computer-list' %}">Cancel</a>
</form>
{% endblock %}
