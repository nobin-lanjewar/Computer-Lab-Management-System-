{% extends "base.html" %}
{% block title %}Add lab | Computer Lab Management System{% endblock %}
{% block content %}
<h1 class="h2 mb-3">Add lab</h1>
<form method="post" class="record-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Save lab</button>
    <a class="btn btn-outline-secondary" href="{% url 'labs:lab-list' %}">Cancel</a>
</form>
{% endblock %}
