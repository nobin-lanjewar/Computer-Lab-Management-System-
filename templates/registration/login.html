{% extends "base.html" %}
{% block title %}Log in | Lab Management{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h1 class="h3 mb-3">Log in</h1>
        {% if form.errors %}<div class="alert alert-danger" role="alert">The username or password was not recognized.</div>{% endif %}
        <form method="post" class="record-form">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-primary" type="submit">Log in</button>
        </form>
    </div>
</div>
{% endblock %}
